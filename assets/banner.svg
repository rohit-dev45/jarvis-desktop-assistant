<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1220"/><stop offset="1" stop-color="#132a3e"/></linearGradient>
    <radialGradient id="core" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#7df9ff"/><stop offset="0.6" stop-color="#1fb6d6"/><stop offset="1" stop-color="#1fb6d6" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="1200" height="300" fill="url(#bg)"/>
  <g transform="translate(180,150)" fill="none" stroke="#38d6f0">
    <circle r="95" stroke-opacity="0.25" stroke-width="2"/>
    <circle r="75" stroke-width="6" stroke-dasharray="40 14"><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="12s" repeatCount="indefinite"/></circle>
    <circle r="55" stroke-width="3" stroke-dasharray="6 8" stroke-opacity="0.8"><animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="8s" repeatCount="indefinite"/></circle>
    <circle r="32" fill="url(#core)" stroke="none"><animate attributeName="r" values="28;34;28" dur="2.4s" repeatCount="indefinite"/></circle>
  </g>
  <text x="330" y="135" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="64" font-weight="700" fill="#e6f7ff">J.A.R.V.I.S. Desktop</text>
  <text x="332" y="185" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="26" fill="#8fd8ea">Voice assistant for Windows · NVIDIA NIM · tool calling · safety-first</text>
  <g font-family="Consolas, monospace" font-size="18" fill="#ffd166">
    <text x="332" y="235">"Hey Jarvis" → Whisper STT → NIM LLM → allow-listed tools → speech</text>
  </g>
</svg>
